name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Fetch OpenVPN for Android API (AIDL)
        run: bash scripts/fetch_aidl.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            -PCACHE_RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/servers-cache/vpngate.csv" \
            -PCACHE_CDN_URL="https://cdn.jsdelivr.net/gh/${{ github.repository }}@servers-cache/vpngate.csv"
          cp app/build/outputs/apk/debug/app-debug.apk VpnGateClient.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VpnGateClient-apk
          path: VpnGateClient.apk
