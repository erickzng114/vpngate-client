name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Fetch OpenVPN for Android API (AIDL)
        run: bash scripts/fetch_aidl.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            -PCACHE_RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/servers-cache/vpngate.csv" \
            -PCACHE_CDN_URL="https://cdn.jsdelivr.net/gh/${{ github.repository }}@servers-cache/vpngate.csv"
          cp app/build/outputs/apk/debug/app-debug.apk VpnGateClient.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VpnGateClient-apk
          path: VpnGateClient.apk
